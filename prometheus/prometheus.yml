global:
  scrape_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: booking-service
    static_configs:
      - targets:
          - booking-service:8080

  - job_name: profile-service
    static_configs:1
      - targets:
          - profile-service:8080

  - job_name: notification-service
    static_configs:
      - targets:
          - notification-service:8080

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187